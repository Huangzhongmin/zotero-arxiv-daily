name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
      timezone: "Asia/Shanghai"
jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    concurrency:
      group: rss-history-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore RSS seen history
        uses: actions/cache/restore@v4
        with:
          path: .cache/rss_seen.json
          key: rss-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rss-seen-v1-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Save RSS seen history
        if: success() && hashFiles('.cache/rss_seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/rss_seen.json
          key: rss-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
